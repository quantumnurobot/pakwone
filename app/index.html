<title>BrainLock Examiner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F3F6F4; --panel:#FFFFFF; --sunk:#EAF0EC; --ink:#14201C; --muted:#56635D; --line:#D5DDD8;
  --probe:#C2362F; --target:#2F5BD3; --irr:#7F8A84; --accent:#0F6B57; --accent-ink:#FFFFFF;
  --grid:#E3E9E5; --good:#1C7C4A; --good-bg:#E3F4EA; --warn:#8A5A00; --warn-bg:#FFF2DC; --bad:#A42A24; --bad-bg:#FBE6E4;
  --neutral-bg:#ECEFF1; --neutral:#43505A;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0E1513; --panel:#16201D; --sunk:#111A17; --ink:#E6EEEA; --muted:#9AA8A1; --line:#2A3833;
    --probe:#F0645B; --target:#7C9DFF; --irr:#86938D; --accent:#3FBF9C; --accent-ink:#06120E;
    --grid:#1F2B27; --good:#6FD79E; --good-bg:#12291D; --warn:#F2C47A; --warn-bg:#2A2111; --bad:#FF8A82; --bad-bg:#2E1513;
    --neutral-bg:#1F2629; --neutral:#B7C2C9;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0E1513; --panel:#16201D; --sunk:#111A17; --ink:#E6EEEA; --muted:#9AA8A1; --line:#2A3833;
  --probe:#F0645B; --target:#7C9DFF; --irr:#86938D; --accent:#3FBF9C; --accent-ink:#06120E;
  --grid:#1F2B27; --good:#6FD79E; --good-bg:#12291D; --warn:#F2C47A; --warn-bg:#2A2111; --bad:#FF8A82; --bad-bg:#2E1513;
  --neutral-bg:#1F2629; --neutral:#B7C2C9;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--body);padding-inline:16px}
.shell{max-width:1180px;margin-inline:auto;padding-block:0 48px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:1.25rem;font-weight:800}
h2{font-size:1.55rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.02rem;font-weight:600}
p{margin:0;max-width:68ch}
.label{font:500 .72rem/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono)} .num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
a{color:var(--accent)}

/* header */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 16px;padding-block:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:26px;height:26px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 .74rem/1 var(--mono);padding:6px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.top-right{display:flex;flex-wrap:wrap;gap:8px}

/* nav */
nav{display:flex;gap:4px;overflow-x:auto;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:24px}
nav button{font:500 .92rem/1 var(--body);background:none;border:0;color:var(--muted);padding:10px 12px;border-radius:6px;cursor:pointer;white-space:nowrap;display:flex;gap:8px;align-items:center}
nav button .n{font:500 .72rem/1 var(--mono);width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;border:1.5px solid var(--line)}
nav button.done .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav button[aria-current="page"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
nav .sep{width:1px;background:var(--line);margin-inline:6px;flex:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--target);outline-offset:2px}

/* layout */
.view{display:grid;gap:20px}
.view-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.view-head .lede{color:var(--muted);margin-top:6px}
.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:16px;align-content:start}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.fields3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.fields2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
label.f{display:grid;gap:6px;font-weight:500}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=number],textarea,select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%}
textarea{min-height:120px;resize:vertical;font-family:var(--mono);font-size:.9rem;line-height:1.5}
input:disabled,textarea:disabled,select:disabled{opacity:.7}
.cls-probe{border-top:3px solid var(--probe)} .cls-target{border-top:3px solid var(--target)} .cls-irr{border-top:3px solid var(--irr)}
.btn{font:600 .95rem/1 var(--body);padding:11px 16px;border-radius:6px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;color:var(--muted);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.msg{padding:10px 12px;border-radius:6px;font-size:.92rem}
.msg.bad{background:var(--bad-bg);color:var(--bad)} .msg.good{background:var(--good-bg);color:var(--good)} .msg.warn{background:var(--warn-bg);color:var(--warn)}
.msg ul{margin:4px 0 0;padding-left:18px}
.hash{font:.82rem/1.4 var(--mono);word-break:break-all;background:var(--sunk);padding:8px 10px;border-radius:6px}
.checks{display:grid;gap:10px}
.checks label{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start}
.checks input{margin-top:3px;width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 .85rem/1 var(--mono);padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--paper);cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn);text-decoration:line-through}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono);font-size:.86rem;word-break:break-word}

/* stage */
.stage{background:#262B2A;color:#F2F4F3;border-radius:10px;aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;position:relative;overflow:hidden;user-select:none}
.stage .word{font:500 clamp(1.6rem,5vw,3.2rem)/1 var(--mono);letter-spacing:.02em}
.stage .fix{font:300 2.4rem/1 var(--body);color:#9AA39F}
.stage .overlay{position:absolute;inset:auto 12px 10px 12px;display:flex;justify-content:space-between;font:.75rem/1 var(--mono);color:#9AA39F}
.stage .idle{display:grid;gap:10px;justify-items:center;text-align:center;padding:16px;max-width:44ch;color:#C9D0CC}
.stage:fullscreen{border-radius:0;aspect-ratio:auto}
.counters{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.counter{display:grid;gap:4px}
.counter b{font:500 1.3rem/1 var(--mono)}
.bar{height:6px;border-radius:3px;background:var(--grid);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.sq{display:flex;align-items:center;gap:8px;font:.85rem/1 var(--mono)}
.sq .dot{width:10px;height:10px;border-radius:50%;background:var(--irr)}
.sq.ok .dot{background:var(--good)} .sq.art .dot{background:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg label{display:flex;align-items:center;gap:6px;padding:8px 12px;cursor:pointer;font-size:.9rem;border-right:1px solid var(--line)}
.seg label:last-child{border-right:0}
.seg input{accent-color:var(--accent)}

/* report */
.verdict{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center;padding:18px 20px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.vchip{font:600 .8rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:8px 10px;border-radius:6px;grid-row:span 2;align-self:start}
.v-information_present{background:var(--bad-bg);color:var(--bad)}
.v-information_absent{background:var(--good-bg);color:var(--good)}
.v-indeterminate{background:var(--neutral-bg);color:var(--neutral)}
.v-invalid,.v-stopped{background:var(--warn-bg);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--panel);padding:14px 16px;display:grid;gap:6px}
.stat b{font:500 1.35rem/1 var(--mono)}
.stat small{color:var(--muted);font-size:.8rem}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{font:11px var(--mono);fill:var(--muted)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .zero{stroke:var(--line);stroke-width:1}
.chart .onset{stroke:var(--ink);stroke-dasharray:3 3;stroke-width:1}
.chart .win{fill:var(--accent);opacity:.08}
.chart .wl{font:10.5px var(--mono);fill:var(--accent)}
.chart .t-probe{stroke:var(--probe);stroke-width:2.6;fill:none}
.chart .t-target{stroke:var(--target);stroke-width:2.1;fill:none}
.chart .t-irrelevant{stroke:var(--irr);stroke-width:2;fill:none}
.chart .sb-track{fill:var(--grid)}
.chart .sb-fill{fill:var(--ink)}
.chart .sb-th{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 2}
.chart .sb-lbl{font:13px var(--body);fill:var(--ink)}
.chart .sb-val{font:500 13px var(--mono);fill:var(--ink)}
.chart .zone-present{fill:var(--bad);opacity:.12} .chart .zone-absent{fill:var(--good);opacity:.14}
.legend{display:flex;flex-wrap:wrap;gap:14px;font:.8rem/1.2 var(--mono);color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:16px;height:3px;border-radius:2px;display:inline-block}
.sim-banner{font:600 .78rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--warn);background:var(--warn-bg);padding:8px 10px;border-radius:6px;justify-self:start}
.notes{display:grid;gap:10px}
.note{border-left:3px solid var(--line);padding-left:10px}
.note small{color:var(--muted);font-family:var(--mono);font-size:.76rem}
.limits{font-size:.9rem;color:var(--muted)}
.limits li{margin-bottom:4px}

/* tables */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 .72rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--sunk)}
td .vchip{display:inline-block;padding:5px 7px;font-size:.7rem}
.tag{font:500 .7rem/1 var(--mono);padding:3px 6px;border-radius:4px;background:var(--warn-bg);color:var(--warn);margin-left:6px}
.audit td{font-family:var(--mono);font-size:.8rem}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:6px;font-size:.9rem;z-index:10}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted)}

@media (max-width:900px){
  .grid2,.fields3,.fields2{grid-template-columns:1fr}
  .stats,.counters{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="shell">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="6" style="fill:var(--ink)"/><path d="M3 15 C7 15 7 15 9 15 S11 5 13 5 S15 19 17 19 S19 13 23 13" style="fill:none;stroke:var(--probe);stroke-width:2.2;stroke-linecap:round"/></svg>
      <h1>BrainLock Examiner</h1>
    </div>
    <div class="top-right">
      <span class="pill warn">Research use only</span>
      <span class="pill">Data stays in this browser</span>
    </div>
  </header>

  <nav id="nav" aria-label="Examiner steps">
    <button data-view="protocol"><span class="n">1</span>Protocol</button>
    <button data-view="consent"><span class="n">2</span>Consent</button>
    <button data-view="record"><span class="n">3</span>Record</button>
    <button data-view="report"><span class="n">4</span>Report</button>
    <span class="sep" aria-hidden="true"></span>
    <button data-view="sessions">Sessions</button>
    <button data-view="audit">Audit log</button>
  </nav>

  <main id="main"></main>

  <footer>
    BrainLock detects recognition of specific details. It does not detect lies, guilt or intent, and it is not validated for legal or employment decisions. Engine: <span class="mono" id="ver"></span>
  </footer>
</div>
<div class="toast" id="toast" hidden></div>

<script src="brainprint.js"></script>
<script>
(function(){
"use strict";
var O = Object.assign({}, BP.DEFAULTS);
var STORE = "brainlock.examiner.v1";
var KIND_LABEL = {probe:"Probe", target:"Target", irrelevant:"Irrelevant"};
var VERDICT = {
  information_present:{chip:"Information present", text:"The probe responses matched the known-target responses. Both tests reached the presence threshold."},
  information_absent:{chip:"Information absent", text:"The probe responses matched the irrelevant responses. Both tests fell to the absence threshold."},
  indeterminate:{chip:"Indeterminate", text:"The data does not support a conclusion either way. Treat this session as giving no answer."},
  invalid:{chip:"Invalid session", text:"Too many trials were rejected to analyze. Check electrode contact and re-test."},
  stopped:{chip:"Stopped", text:"The session was stopped before it finished. Nothing was analyzed."}
};

// ---------------- state ----------------
function exampleProtocol(){
  return {name:"Workshop break-in (example)", version:1, probes:["crowbar"], targets:["screwdriver"],
    irrelevants:["hammer","wrench","pliers","chisel"], provenance:"crowbar: tool recovered at the scene, listed only in the sealed evidence log; never released to press or discussed with the subject.",
    repetitions:30, presentThreshold:0.9, absentThreshold:0.3, locked:false, hash:null, lockedAt:null};
}
var S = load() || {protocol:exampleProtocol(), subject:null, sessions:[], audit:[], view:"report", reportId:null, seeded:false};
var run = null; // live recording state (not persisted)

function load(){ try{ var raw = localStorage.getItem(STORE); return raw ? JSON.parse(raw) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){} }

// ---------------- hashing and audit ----------------
function hex(buf){ return Array.prototype.map.call(new Uint8Array(buf), function(b){return b.toString(16).padStart(2,"0");}).join(""); }
function fnv(str){ var h=0x811c9dc5; for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return "fnv1a:"+h.toString(16).padStart(8,"0"); }
function sha256(str){
  try{ if(window.crypto && crypto.subtle) return crypto.subtle.digest("SHA-256", new TextEncoder().encode(str)).then(function(b){return "sha256:"+hex(b);}).catch(function(){return fnv(str);}); }catch(e){}
  return Promise.resolve(fnv(str));
}
function canon(p){ return JSON.stringify({name:p.name,version:p.version,probes:p.probes,targets:p.targets,irrelevants:p.irrelevants,provenance:p.provenance,repetitions:p.repetitions,presentThreshold:p.presentThreshold,absentThreshold:p.absentThreshold}); }
var auditQueue = Promise.resolve();
function audit(action, detail){
  auditQueue = auditQueue.then(function(){
    var prev = S.audit.length ? S.audit[S.audit.length-1].hash : "genesis";
    var ev = {ts:new Date().toISOString(), action:action, detail:detail||"", prev:prev};
    return sha256(prev+"|"+ev.ts+"|"+action+"|"+ev.detail).then(function(h){ ev.hash=h; S.audit.push(ev); save(); if(S.view==="audit") render(); });
  });
  return auditQueue;
}

// ---------------- helpers ----------------
function $(sel, root){ return (root||document).querySelector(sel); }
function el(tag, attrs, kids){
  var n = document.createElement(tag);
  if(attrs) Object.keys(attrs).forEach(function(k){
    var v = attrs[k];
    if(k==="text") n.textContent = v;
    else if(k==="html") n.innerHTML = v;
    else if(k.slice(0,2)==="on") n.addEventListener(k.slice(2), v);
    else if(v===true) n.setAttribute(k,"");
    else if(v!==false && v!=null) n.setAttribute(k, v);
  });
  (kids||[]).forEach(function(c){ if(c!=null) n.appendChild(typeof c==="string" ? document.createTextNode(c) : c); });
  return n;
}
function lines(t){ return t.split(/\n/).map(function(s){return s.trim();}).filter(Boolean); }
function pct(x){ return Math.round(x*100)+"%"; }
function fmtDate(iso){ var d=new Date(iso); return d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})+" "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}); }
function shortHash(h){ return h ? h.replace(/^(sha256|fnv1a):/,"").slice(0,12) : "—"; }
function toast(msg){ var t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(function(){t.hidden=true;},2600); }
function uid(){ return "S"+Date.now().toString(36).toUpperCase().slice(-6)+Math.floor(Math.random()*36).toString(36).toUpperCase(); }
function round2(a){ return a.map(function(v){return Math.round(v*100)/100;}); }
var downloadsP = (window.claude && window.claude.use) ? window.claude.use("downloads") : Promise.resolve(null);
var downloadsNs = null; downloadsP.then(function(d){ downloadsNs=d; if(d && !(run && run.active)) render(); });
function offerFile(name, data){
  if(!downloadsNs) return;
  downloadsNs.save({filename:name, data:data}).then(function(){ toast("Saved "+name); }).catch(function(e){
    if(e && e.code==="declined") return;
    toast(e && e.code==="rate_limited" ? "A save prompt is already open." : "Saving isn't available here.");
  });
}
function copyText(txt){
  try{ navigator.clipboard.writeText(txt).then(function(){toast("Copied to clipboard");}, function(){toast("Copy was blocked. Select the text in the report instead.");}); }
  catch(e){ toast("Copy was blocked. Select the text in the report instead."); }
}

// ---------------- navigation ----------------
function stepsDone(){
  return {protocol:!!S.protocol.locked, consent:!!(S.subject && S.subject.consentedAt), record:false, report:false};
}
function go(view){ if(run && run.active && view!=="record"){ toast("Stop or finish the recording first."); return; } S.view=view; save(); render(); window.scrollTo(0,0); }
$("#nav").addEventListener("click", function(e){ var b=e.target.closest("button[data-view]"); if(b) go(b.dataset.view); });
$("#ver").textContent = BP.VERSION;

function render(){
  var done = stepsDone();
  document.querySelectorAll("#nav button").forEach(function(b){
    var v=b.dataset.view; b.classList.toggle("done", !!done[v]);
    if(v===S.view) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  var main=$("#main"); main.innerHTML="";
  var fn = {protocol:viewProtocol, consent:viewConsent, record:viewRecord, report:viewReport, sessions:viewSessions, audit:viewAudit}[S.view] || viewReport;
  main.appendChild(fn());
}

// ---------------- 1. protocol ----------------
function viewProtocol(){
  var p=S.protocol, locked=p.locked;
  var v=el("section",{class:"view"});
  v.appendChild(el("div",{class:"view-head"},[
    el("div",{},[el("span",{class:"label",text:"Step 1"}), el("h2",{text:"Build and lock the protocol"}),
      el("p",{class:"lede",text:"List one item per line. Probes are details only someone with inside knowledge would recognize. Targets are taught to the subject before the test. Irrelevants are plausible but wrong. Locking fixes the lists with a hash, so no one can change them after seeing results."})])
  ]));
  var name=el("input",{type:"text",id:"p-name",value:p.name,disabled:locked});
  var reps=el("input",{type:"number",id:"p-reps",min:"5",max:"100",value:p.repetitions,disabled:locked});
  var pt=el("input",{type:"number",id:"p-pt",min:"0.5",max:"0.99",step:"0.01",value:p.presentThreshold,disabled:locked});
  var at=el("input",{type:"number",id:"p-at",min:"0.01",max:"0.5",step:"0.01",value:p.absentThreshold,disabled:locked});
  var tp=el("textarea",{id:"p-probes",disabled:locked}); tp.value=p.probes.join("\n");
  var tt=el("textarea",{id:"p-targets",disabled:locked}); tt.value=p.targets.join("\n");
  var ti=el("textarea",{id:"p-irr",disabled:locked}); ti.value=p.irrelevants.join("\n");
  var prov=el("textarea",{id:"p-prov",disabled:locked,style:"min-height:90px;font-family:var(--body)"}); prov.value=p.provenance||"";
  var errBox=el("div"); var info=el("p",{class:"muted"});

  function read(){
    return Object.assign({},p,{name:name.value.trim()||"Untitled protocol", repetitions:+reps.value, presentThreshold:+pt.value, absentThreshold:+at.value,

var PROTOCOL_FORMAT="brainlock.protocol/1";

    locked:!!p.locked, hash:p.hash||null, lockedAt:p.lockedAt||null};

    provenance:String(d.provenance||""), repetitions:+d.repetitions||O.repetitions,

}
function analyseAndSave(epochs, labels, times, extra){
  var main=$("#main"); main.innerHTML=""; main.appendChild(el("div",{class:"card"},[el("h3",{text:"Analyzing…"}),el("p",{class:"muted",text:"Filtering, rejecting artifacts and running 1,000 bootstrap iterations for each test."})]));
  setTimeout(function(){
    var po=Object.assign({}, O, extra.opts);

      windows:res.windows, times:times.filter(function(_,i){return i%2===0;}),

      ampDiffs: res.ampDiffs ? round2(res.ampDiffs.filter(function(_,i){return i%4===0;})) : null};

function importCsv(text, filename){
  var parsed=BP.parseEpochCsv(text);
  if(parsed.errors.length){ toast(parsed.errors[0]); return; }
  var o={fs:recOpts.fs, epochPreMs:recOpts.pre};
  var dt=1000/o.fs, times=[]; for(var i=0;i<parsed.samples;i++) times.push(-o.epochPreMs+i*dt);
  if(!times.some(function(t){return t<0;})){ toast("The recording needs a pre-stimulus baseline. Set the baseline above 0 ms."); return; }
  if(times[times.length-1]<700){ toast("Epochs are too short. They must run to at least 700 ms after the stimulus."); return; }
  run=null;
  audit("recording.imported", filename+" · "+parsed.epochs.length+" trials");
  analyseAndSave(parsed.epochs, parsed.labels, times, {opts:{fs:o.fs}, session:{source:"imported", file:filename, attention:null}});
}
function sampleCsv(){

  var seq=BP.buildSequence({probes:p.probes,targets:p.targets,irrelevants:p.irrelevants,repetitions:p.repetitions},42);
  seq.forEach(function(st){ rows.push(st.kind+","+st.text.replace(/,/g," ")+","+BP.simulateEpoch(st.kind,{knowsProbe:true,p300Uv:8,noiseUv:10,blinkRate:0.02},O,r,times).map(function(v){return v.toFixed(2);}).join(",")); });
  return rows.join("\n");
}

// ---------------- 4. report ----------------
function erpChart(res){
  var W=640,H=300,L=46,R=14,T=16,B=34, t=res.times, all=res.erp.probe.concat(res.erp.target,res.erp.irrelevant);
  var lo=Math.min.apply(null,all), hi=Math.max.apply(null,all), step=hi-lo>24?8:4;
  lo=Math.floor(Math.min(lo,-2)/step)*step; hi=Math.ceil(Math.max(hi,4)/step)*step;
  function x(v){return L+(v-t[0])/(t[t.length-1]-t[0])*(W-L-R);} function y(v){return T+(hi-v)/(hi-lo)*(H-T-B);}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Averaged brain responses for probe, target and irrelevant stimuli">';
  for(var tv=-200; tv<=t[t.length-1]; tv+=200){ s+='<line class="gl" x1="'+x(tv)+'" x2="'+x(tv)+'" y1="'+T+'" y2="'+(H-B)+'"/><text class="ax" x="'+x(tv)+'" y="'+(H-B+18)+'" text-anchor="middle">'+tv+'</text>'; }
  for(var yv=lo; yv<=hi; yv+=step){ s+='<line class="'+(yv===0?"zero":"gl")+'" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(yv)+'" y2="'+y(yv)+'"/><text class="ax" x="'+(L-8)+'" y="'+(y(yv)+4)+'" text-anchor="end">'+yv+'</text>'; }
  var w=res.windows.corr; s+='<rect class="win" x="'+x(w[0])+'" y="'+T+'" width="'+(x(w[1])-x(w[0]))+'" height="'+(H-T-B)+'"/><text class="wl" x="'+(x(w[0])+5)+'" y="'+(T+13)+'">analysis window</text>';
  s+='<line class="onset" x1="'+x(0)+'" x2="'+x(0)+'" y1="'+T+'" y2="'+(H-B)+'"/>';
  s+='<text class="ax" x="'+(W-R)+'" y="'+(H-4)+'" text-anchor="end">ms after stimulus</text><text class="ax" x="4" y="'+(T+4)+'">µV</text>';
  ["irrelevant","target","probe"].forEach(function(k){ var d=res.erp[k].map(function(v,i){return (i?"L":"M")+x(t[i]).toFixed(1)+" "+y(v).toFixed(1);}).join(""); s+='<path class="t-'+k+'" d="'+d+'"/>'; });
  return s+"</svg>";
}
function supportChart(res){
  var W=400,H=128,L=112,R=44, pt=res.presentT, at=res.absentT;
  function x(v){return L+v*(W-L-R);}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Bootstrap support for each test compared with the thresholds">';
  [["Correlation test",res.correlationSupport,18],["Amplitude test",res.amplitudeSupport,62]].forEach(function(r){
    var yy=r[2];
    s+='<text class="sb-lbl" x="0" y="'+(yy+15)+'">'+r[0]+'</text>';
    s+='<rect class="sb-track" x="'+L+'" y="'+yy+'" width="'+(W-L-R)+'" height="22" rx="3"/>';
    s+='<rect class="zone-absent" x="'+L+'" y="'+yy+'" width="'+(x(at)-L)+'" height="22"/>';
    s+='<rect class="zone-present" x="'+x(pt)+'" y="'+yy+'" width="'+(x(1)-x(pt))+'" height="22"/>';
    s+='<rect class="sb-fill" x="'+L+'" y="'+(yy+8)+'" width="'+Math.max(2,x(r[1])-L)+'" height="6" rx="3"/>';
    s+='<text class="sb-val" x="'+(W-R+8)+'" y="'+(yy+15)+'">'+pct(r[1])+'</text>';
  });
  [[at,"absent ≤ "+pct(at)],[pt,"present ≥ "+pct(pt)]].forEach(function(th){
    s+='<line class="sb-th" x1="'+x(th[0])+'" x2="'+x(th[0])+'" y1="10" y2="92"/><text class="ax" x="'+x(th[0])+'" y="112" text-anchor="middle">'+th[1]+'</text>';
  });
  return s+"</svg>";
}

// ---------------- audit ----------------
function viewAudit(){
  var v=el("section",{class:"view"}), status=el("div");
  var verify=el("button",{class:"btn ghost",text:"Verify chain",onclick:function(){
    var prev="genesis", i=0, chain=S.audit.slice();
    (function step(){
      if(i>=chain.length){ status.innerHTML=""; status.appendChild(el("div",{class:"msg good",text:"Chain intact: all "+chain.length+" entries link correctly."})); return; }
      var ev=chain[i];
      if(ev.prev!==prev){ bad(i); return; }
      sha256(ev.prev+"|"+ev.ts+"|"+ev.action+"|"+ev.detail).then(function(h){ if(h!==ev.hash){ bad(i); return; } prev=ev.hash; i++; step(); });
    })();
    function bad(k){ status.innerHTML=""; status.appendChild(el("div",{class:"msg bad",text:"Chain broken at entry "+(k+1)+". The log was edited outside this app."})); }
  }});
  v.appendChild(el("div",{class:"view-head"},[el("div",{},[el("h2",{text:"Audit log"}),el("p",{class:"lede",text:"Each entry includes the hash of the one before it, so any later edit breaks the chain."})]), verify]));
  v.appendChild(status);
  var tb=el("tbody",{}, S.audit.slice().reverse().map(function(ev){ return el("tr",{},[el("td",{text:fmtDate(ev.ts)}), el("td",{text:ev.action}), el("td",{text:ev.detail}), el("td",{text:shortHash(ev.hash)})]); }));
  v.appendChild(el("div",{class:"card tbl audit",style:"padding:0"},[S.audit.length?el("table",{},[el("thead",{},[el("tr",{},["Time","Action","Detail","Hash"].map(function(h){return el("th",{text:h});}))]), tb]):el("div",{class:"empty",text:"No entries yet."})]));
  return v;
}

function seedExample(){

    var epochs=seq.map(function(st){return BP.simulateEpoch(st.kind,sim,O,r,times);});
    var pre=BP.preprocess(epochs,times,O), kept=seq.map(function(x){return x.kind;}).filter(function(_,i){return pre.keep[i];});
    var res=BP.analyse(pre.clean,kept,times,{seed:seed});
    var ev=function(a){return a.filter(function(_,i){return i%2===0;});};
    var sess={id:"EX-0001", example:true, createdAt:new Date().toISOString(), subject:"S-000 (example)", excluded:[],
      protocol:{name:p.name, version:1, hash:h, presentThreshold:0.9, absentThreshold:0.3}, source:"simulated", seed:seed, sim:sim, notes:[],
      attention:{shown:180/6, hits:29, falseAlarms:0, mode:"sim"}, verdict:res.verdict,
      result:{verdict:res.verdict, correlationSupport:res.correlationSupport, amplitudeSupport:res.amplitudeSupport, nTrials:res.nTrials,
        rejected:pre.keep.filter(function(k){return !k;}).length, total:seq.length, nBoot:res.nBoot, version:BP.VERSION, windows:res.windows,
        times:ev(times), erp:{probe:round2(ev(res.erp.probe)), target:round2(ev(res.erp.target)), irrelevant:round2(ev(res.erp.irrelevant))}}};
    S.sessions.push(sess); S.reportId=sess.id; S.seeded=true; save();
    return audit("example.generated", sess.id+" · simulated · "+res.verdict);
  });
}
